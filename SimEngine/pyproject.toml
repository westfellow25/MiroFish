[project]
name = "simengine"
version = "0.1.0"
description = "Universal multi-agent simulation engine. Inspired by MiroFish methodology."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
zep = ["zep-cloud>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
